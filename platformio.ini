; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
upload_port = COM8
monitor_port = COM8
monitor_speed = 115200
upload_speed = 921600
lib_deps =
	ropg/Heltec_ESP32_LoRa_v3 @ ^0.9.2
	bakercp/CRC32 @ ^2.0.0
	emelianov/modbus-esp8266 @ ^4.1.0
	knolleary/PubSubClient @ ^2.8          ; puente MQTT
	bblanchon/ArduinoJson @ ^7.0.4         ; payloads del puente MQTT

; FW_VERSION_OVERRIDE lo inyecta el CI (.github/workflows/release.yml) desde el tag vX.Y.Z.
; Sin CI queda vacio y se usa el FW_SEMVER de respaldo de main.cpp.
build_flags =
	${sysenv.EXTRA_BUILD_FLAGS}
